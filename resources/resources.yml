resources:
  jobs:
    job_schedule_ingestao:
      name: "Execução da Ingestão de dados" # Executar o Job todos os dias a 1hora da manhã
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"
  
      tasks:
        - task_key: "tarefa_de_execucao_python"
          notebook_task:
            notebook_path: ../src/bronze/ingestao_jdbc.ipynb
            base_parameters:
              catalog_dev: ${var.catalog_name}
              schema: bronze