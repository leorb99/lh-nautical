resources:
  jobs:
    job_schedule_ingestao:
      # Executar o Job todos os dias a 1hora da manhã
      name: "Execução da Ingestão de dados" 
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"

      # Quando entrar no expect um e-mail é disparado nos e-mail cadastrados
      email_notifications:
        on_failure:
          - "adriano.takata@indicium.ai"
          #- "time-dados@suaempresa.com" # Pode colocar mais de um e-mail se quiser
  
      tasks:
        - task_key: "tarefa_de_execucao_python"
          notebook_task:
            notebook_path: ../src/bronze/ingestao_jdbc.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema: bronze
              numPartitions: "4"

  
    job_autoloader_ingestao:
      name: "Execução da Ingestão de Dados das Planilhas" # Executar o Job todos os dias a 1hora da manhã
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: "UNPAUSED"
  
      tasks:
        - task_key: "task_autoloader_ingestao"
          notebook_task:
            notebook_path: ../src/bronze/ingestao_bucket_autoloader.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name} 
              schema: bronze