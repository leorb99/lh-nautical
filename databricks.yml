# This is a Databricks asset bundle definition for lh_nautical_project. 
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lh_nautical_project
  uuid: e6ea567c-01ca-49e7-a472-4fcdedc496fc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_name:
    description: "Catálogo de destino (pessoal em dev, oficial em prod)" #customizei aqui

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-29497e38-da7d.cloud.databricks.com
    variables:
      catalog_name: dev_leonardo_barbosa_lh_nautical #ajuste para o seu catálogo dev pessoal (ex: dev_nome_sobrenome_lh_nautical)
    presets:
      artifacts_dynamic_version: true

  prod:
    mode: production
    workspace:
      host: https://dbc-29497e38-da7d.cloud.databricks.com
      # Mudei para a pasta Shared para que o Service Principal consiga gerenciar o deploy centralizado
      root_path: /Workspace/Shared/bundles/${bundle.name}/${bundle.target}
    variables:
      catalog_name: prod_lh_nautical #customizei aqui tb
    permissions:
      # Corrigido para service_principal_name para alinhar com o tipo do objeto no Databricks
      - service_principal_name: d45477c2-9a5a-45e8-aa63-ac026acbeac3 #name: sp-cicd-bitbucket-lh-nautical
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE_RUN