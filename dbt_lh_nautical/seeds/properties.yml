version: 2

seeds:
  - name: holidays
    description: List of Brazilian national holidays (2020-2026) including Carnival and Corpus Christi
    config:
      column_types:
        holiday_date: date
        holiday: string

  - name: valid_colors
    description: List of colors
    config:
      column_types:
        valid_colors: string

  - name: valid_materials
    description: >
      List of valid product materials, used to fuzzy-correct typos in
      attr_material via Levenshtein distance, the same approach already
      used for attr_color against valid_colors.
    config:
      column_types:
        valid_materials: string
