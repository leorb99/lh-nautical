version: 2

models:
  - name: stg_brands
    description: "Staging model for supplier brands, with standardized typing and naming from the bronze.brands source"
    columns:
      - name: brand_id
        description: "Unique identifier for the brand"
        tests:
          - unique
          - not_null

      - name: brand_name
        description: "Name of the brand"
        tests:
          - not_null

      - name: brand_country
        description: "Country of origin of the brand"

      - name: is_active
        description: "Indicates whether the brand is currently active"
        tests:
          - not_null

      - name: created_at
        description: "Timestamp of when the brand record was created in the source system"

      - name: updated_at
        description: "Timestamp of when the brand record was last updated in the source system"

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. INITIAL_LOAD, INSERT_OR_UPDATE)."