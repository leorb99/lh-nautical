models:
  - name: stg_purchase_orders
    description: >
      Staging model for purchase orders. This model cleans and standardizes the raw 
      purchase order data, including financial totals, supplier references, and 
      tracking timestamps for CDC.
    
    columns:
      - name: purchase_order_id
        description: "Internal primary key for the purchase order."
        tests:
          - unique
          - not_null

      - name: purchase_order_number
        description: "The natural key / human-readable purchase order number (e.g., PO-000001)."
        tests:
          - unique
          - not_null

      - name: supplier_id
        description: "Foreign key pointing to the supplier associated with this order."
        tests:
          - not_null
          - relationships:
              arguments:
                field: supplier_id
                to: ref('stg_suppliers')

      - name: buyer_id
        description: "Foreign key pointing to the employee/buyer who placed the order."
        tests:
          - not_null
          - relationships:
              arguments:
                field: employee_id
                to: ref('stg_employees')

      - name: destination_location_id
        description: "Foreign key pointing to the physical location where the order should be delivered."
        tests:
          - not_null
          - relationships:
              arguments:
                field: location_id
                to: ref('stg_locations')

      - name: purchase_order_status
        description: "Current status of the purchase order."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['partially_received', 'draft', 'received', 'cancelled', 'sent']
                quote: true

      - name: purchase_order_currency
        description: "The currency used for the purchase order amounts (e.g., BRL, USD)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'BRL', 'EUR']
                quote: true

      - name: purchase_order_subtotal
        description: "The total amount of the order before taxes, shipping, or discounts."
        tests:
          - not_null

      - name: purchase_order_total
        description: "The final total amount of the purchase order."
        tests:
          - not_null

      - name: placed_at
        description: "Timestamp when the purchase order was officially placed/submitted."

      - name: purchase_order_expected_delivery_at
        description: "The expected delivery date for the purchase order."

      - name: created_at
        description: "Timestamp when the record was created in the source database."
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the record was last updated. Crucial for CDC pipelines."
        tests:
          - not_null

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null
      
      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null
      
      - name: _action
        description: "Ingestion action associated with the record (e.g. INITIAL_LOAD, INSERT_OR_UPDATE)."