version: 2

models:
  - name: stg_product_suppliers
    description: "Staging model for product-supplier relationships."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - supplier_id

    columns:
      - name: product_variant_id
        description: "Foreign key to the product variant."
        tests:
          - not_null
          - relationships:
              arguments:
                field: product_variant_id
                to: ref('stg_product_variants')

      - name: supplier_id
        description: "Foreign key to the supplier."
        tests:
          - not_null
          - relationships:
              arguments:
                field: supplier_id
                to: ref('stg_suppliers')

      - name: product_suppliers_supplier_sku
        description: "Supplier-specific SKU for the product variant."

      - name: product_suppliers_last_quoted_cost
        description: "Most recently quoted cost from the supplier."

      - name: product_suppliers_lead_time_days
        description: "Expected supplier lead time in days."

      - name: created_at
        description: "Timestamp when the record was created in the source system."

      - name: updated_at
        description: "Timestamp when the record was last updated in the source system."

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. INITIAL_LOAD, INSERT_OR_UPDATE)."
