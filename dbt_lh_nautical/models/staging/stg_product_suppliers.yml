models:
  - name: stg_product_suppliers
    description: >
      Staging model for product suppliers. This model cleans and standardizes the raw
      supplier-product mapping data from the e-commerce system, including supplier SKUs,
      quoted costs, lead times and ingestion metadata.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_variant_id
            - supplier_id

    columns:
      - name: product_variant_id
        description: "Foreign key to the product variant."
        tests:
          - not_null
          - relationships:
              field: product_variant_id
              to: ref('stg_product_variants')
      
      - name: supplier_id
        description: "Foreign key to the supplier."
        tests:
          - not_null
          - relationships:
              field: supplier_id
              to: ref('stg_suppliers')
      
      - name: supplier_sku
        description: "Supplier-specific SKU for the product variant."
      
      - name: last_quoted_cost
        description: "The most recent cost quoted by the supplier."
      
      - name: lead_time_days
        description: "Supplier lead time for the product variant, in days."
      
      - name: created_at
        description: "Timestamp when this supplier mapping was created in the source system."
        tests:
          - not_null
      
      - name: updated_at
        description: "Timestamp when this supplier mapping was last updated in the source system."
        tests:
          - not_null
      
      - name: _hash
        description: "MD5/SHA hash of the record used for deduplication or change tracking."
        tests:
          - not_null
      
      - name: _ingested_at
        description: "Timestamp when the data was ingested into the Bronze layer."
        tests:
          - not_null
      
      - name: _action
        description: "Action type from the CDC pipeline (e.g., INITIAL_LOAD, INSERT_OR_UPDATE)."
        tests:
          - not_null
          - accepted_values:
              values: ['INITIAL_LOAD', 'INSERT_OR_UPDATE']
              quote: true