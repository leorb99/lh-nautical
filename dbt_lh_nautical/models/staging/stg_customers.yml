version: 2

models:
  - name: stg_customers
    description: "Staging model for customers, with standardized typing and naming from the bronze.customers source"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - unique
          - not_null

      - name: customer_person_type
        description: "Type of customer person: 'PF' (individual) or 'PJ' (company)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']

      - name: customer_legal_name
        description: "Legal name of the customer (registered business or individual name)"
        tests:
          - not_null

      - name: customer_trade_name
        description: "Trade name (fantasy name) of the customer, applicable only to PJ customers"

      - name: customer_tax_id
        description: "Tax identification number of the customer (CPF for individuals, CNPJ for companies) (kept as string since it may contain leading zeros)"
        tests:
          - not_null
          - unique

      - name: customer_state_registration
        description: "State registration number of the customer, applicable only to PJ customers (kept as string since it may contain leading zeros)"

      - name: customer_email
        description: "Email address of the customer"

      - name: customer_phone
        description: "Phone number of the customer"

      - name: is_active
        description: "Indicates whether the customer is currently active"
        tests:
          - not_null

      - name: created_at
        description: "Timestamp of when the customer record was created in the source system"

      - name: updated_at
        description: "Timestamp of when the customer record was last updated in the source system"

      - name: _hash
        description: "Row control hash, used to detect changes during ingestion"
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp of when the record was ingested into the bronze layer"
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CARGA_INICIAL', 'INSERT_OU_UPDATE']