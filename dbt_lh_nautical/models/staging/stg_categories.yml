version: 2

models:
  - name: stg_categories
    description: "Staging model for product categories, with standardized typing and naming from the bronze.categories source"
    columns:
      - name: category_id
        description: "Unique identifier for the category"
        tests:
          - unique
          - not_null

      - name: category_name
        description: "Name of the category"
        tests:
          - not_null

      - name: category_url_slug
        description: "URL-friendly identifier (slug) for the category"

      - name: parent_category_id
        description: "Identifier of the parent category, if this category is a subcategory (self-referencing FK)"
        tests:
          - relationships:
              arguments:
                to: ref('stg_categories')
                field: category_id

      - name: is_active
        description: "Indicates whether the category is currently active"
        tests:
          - not_null

      - name: created_at
        description: "Timestamp of when the category record was created in the source system"

      - name: updated_at
        description: "Timestamp of when the category record was last updated in the source system"

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. INITIAL_LOAD, INSERT_OR_UPDATE)."