version: 2

models:
  - name: stg_stock_movements
    description: "Staging table containing cleaned and standardized inventory movement records."

    columns:
      - name: stock_movement_id
        description: "Primary key of the stock movements table."
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: "Foreign key mapping to the product variants table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product_variants')
                field: product_variant_id

      - name: location_id
        description: "Foreign key mapping to the locations table."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_locations')
                field: location_id

      - name: stock_movement_type
        description: "The type of inventory movement recorded."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["purchase_in", "sale_out", "return_in", "return_out"]

      - name: stock_movement_quantity
        description: "The signed quantity associated with the inventory movement."
        tests:
          - not_null

      - name: stock_movement_reference_table
        description: "The source business table associated with the inventory movement."
        tests:
          - accepted_values:
              arguments:
                values: ["orders", "goods_receipts", "returns"]

      - name: stock_movement_reference_id
        description: "The identifier of the related record in the source business table."

      - name: employee_id
        description: "Foreign key mapping to the employee associated with the movement."
        tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id

      - name: stock_movement_notes
        description: "Optional notes describing the inventory movement."

      - name: occurred_at
        description: "Timestamp indicating when the inventory movement occurred."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp indicating when the movement record was created."
        tests:
          - not_null

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)."