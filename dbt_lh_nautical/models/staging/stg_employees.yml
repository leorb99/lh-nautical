version: 2

models:
  - name: stg_employees
    description: "Staging model for employees, with standardized typing and naming from the bronze.employees source"
    columns:
      - name: employee_id
        description: "Unique identifier for the employee"
        tests:
          - unique
          - not_null

      - name: employee_full_name
        description: "Full name of the employee"
        tests:
          - not_null

      - name: employee_cpf
        description: "CPF (tax identification number) of the employee (kept as string since it may contain leading zeros)"
        tests:
          - not_null
          - unique

      - name: employee_email
        description: "Email address of the employee"

      - name: employee_role
        description: "Job role/position of the employee"
        tests:
          - not_null

      - name: employee_primary_location_id
        description: "Identifier of the employee's primary work location from the locations table (FK)"
        # tests:
        #   - relationships:
        #       arguments:
        #         to: ref('stg_locations')
        #         field: location_id

      - name: employee_hire_date
        description: "Date the employee was hired"
        tests:
          - not_null

      - name: employee_termination_date
        description: "Date the employee was terminated, applicable only to inactive employees"

      - name: is_active
        description: "Indicates whether the employee is currently active"
        tests:
          - not_null

      - name: created_at
        description: "Timestamp of when the employee record was created in the source system"

      - name: updated_at
        description: "Timestamp of when the employee record was last updated in the source system"

      - name: _hash
        description: "Row control hash, used to detect changes during ingestion"
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp of when the record was ingested into the bronze layer"
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CARGA_INICIAL', 'INSERT_OU_UPDATE']