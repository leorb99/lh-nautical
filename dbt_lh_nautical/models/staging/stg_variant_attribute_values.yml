version: 2

models:
  - name: stg_variant_attribute_values
    description: "Staging table containing the values assigned to each attribute of a product variant."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - attribute_id

    columns:
      - name: product_variant_id
        description: "Foreign key identifying the product variant associated with the attribute value."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product_variants')
                field: product_variant_id

      - name: attribute_id
        description: "Foreign key identifying the attribute represented by the value."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_attributes')
                field: attribute_id

      - name: attribute_value
        description: "Text value assigned to the attribute for the product variant."
        tests:
          - not_null

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)."
