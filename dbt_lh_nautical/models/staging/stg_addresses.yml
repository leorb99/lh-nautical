version: 2

models:
  - name: stg_addresses
    description: "Staging model for addresses, with standardized typing and naming from the bronze.addresses source"
    columns:
      - name: address_id
        description: "Unique identifier for the address"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier of the customer who owns the address"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: address_type
        description: "Type of address (e.g. billing, secondary)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['billing', 'secondary']

      - name: address_postal_code
        description: "Postal code of the address, kept as string (may start with zero, or contain a hyphen)"
        tests:
          - not_null

      - name: address_street_name
        description: "Street name"

      - name: address_number
        description: "Address number (string, may contain letters)"

      - name: address_complement
        description: "Address complement (apartment, block, etc.)"

      - name: address_district
        description: "District/neighborhood of the address"

      - name: address_city
        description: "City of the address"

      - name: address_state
        description: "State of the address"

      - name: address_country
        description: "Country of the address"

      - name: address_is_primary
        description: "Indicates whether this is the customer's primary address ('billing')"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. INITIAL_LOAD, INSERT_OR_UPDATE)."