version: 2

models:
  - name: stg_addresses
    description: "Staging model for addresses, with standardized typing and naming from the bronze.addresses source"
    columns:
      - name: address_id
        description: "Unique identifier for the address"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier of the customer who owns the address"
        tests:
          - not_null

      - name: address_type
        description: "Type of address (e.g. billing, secondary)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['billing', 'secondary']

      - name: postal_code
        description: "Postal code of the address, kept as string (may start with zero, or contain a hyphen)"
        tests:
          - not_null

      - name: street_name
        description: "Street name"

      - name: address_number
        description: "Address number (string, may contain letters)"

      - name: address_complement
        description: "Address complement (apartment, block, etc.)"

      - name: district
        description: "District/neighborhood of the address"

      - name: city
        description: "City of the address"

      - name: state
        description: "State of the address"

      - name: country
        description: "Country of the address"

      - name: is_primary
        description: "Indicates whether this is the customer's primary address ('billing')"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: _hash
        description: "Row control hash, used to detect changes during ingestion"
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp of when the record was ingested into the bronze layer"
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CARGA_INICIAL', 'INSERT_OU_UPDATE']