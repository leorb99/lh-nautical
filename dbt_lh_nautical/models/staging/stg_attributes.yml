version: 2

models:
  - name: stg_attributes
    description: "Staging model for product attributes (only its keys, not its values), with standardized typing and naming from the bronze.attributes source"
    columns:
      - name: attribute_id
        description: "Unique identifier for the product attribute"
        tests:
          - unique
          - not_null

      - name: attribute_name
        description: "Name of the product attribute"
        tests:
          - not_null

      - name: attribute_data_type
        description: "Data type of the product attribute value expected from bronze.variant_attribute_values table (e.g. 'number', 'text', 'boolean')"

      - name: _hash
        description: "Hash generated for record deduplication and change detection."
        tests:
          - not_null

      - name: _ingested_at
        description: "Timestamp when the row was ingested into the data lake / bronze layer."
        tests:
          - not_null

      - name: _action
        description: "Ingestion action associated with the record (e.g. CARGA_INICIAL, INSERT_OU_UPDATE)."