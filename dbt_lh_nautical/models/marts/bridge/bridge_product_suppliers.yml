version: 2

models:
  - name: bridge_product_suppliers
    description: >
      Bridge table connecting product variants and suppliers. Each row
      represents one relationship between a product variant and a supplier,
      including supplier-specific SKU, latest quoted cost and lead time.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - supplier_id

    columns:
      - name: product_supplier_sk
        description: >
          Surrogate key generated from product_variant_id and supplier_id.
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: "Identifier of the product variant."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product_variants')
                field: product_variant_id

      - name: supplier_id
        description: "Identifier of the supplier."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id

      - name: supplier_sku
        description: "SKU used by the supplier for the product variant."

      - name: last_quoted_cost
        description: "Most recent cost quoted by the supplier."

      - name: lead_time_days
        description: "Expected supplier lead time in days."

      - name: created_at
        description: "Timestamp when the supplier relationship was created."

      - name: updated_at
        description: "Timestamp when the supplier relationship was last updated."
