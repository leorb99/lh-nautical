version: 2

models:
  - name: fct_inventory_replenishment
    description: >
      Inventory replenishment recommendation fact table with one row per
      product variant and location. Combines current stock, recent demand and
      hierarchical lead-time estimates to calculate replenishment requirements.
      A seven-day safety-stock assumption is used in this initial version.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - location_id

    columns:
      - name: inventory_replenishment_sk
        description: Surrogate key generated from product variant and location.
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: Identifier of the product variant.
        tests:
          - not_null

      - name: location_id
        description: Identifier of the inventory location.
        tests:
          - not_null

      - name: current_inventory_snapshot_sk
        description: Identifier of the current inventory snapshot record.
        tests:
          - not_null

      - name: quantity_on_hand
        description: Current quantity available in inventory.
        tests:
          - not_null

      - name: open_purchase_order_quantity
        description: >
          Quantity already ordered and still expected from sent or partially
          received purchase orders for the same product variant and location.
        tests:
          - not_null

      - name: open_purchase_order_item_count
        description: >
          Number of active purchase order items contributing to the open
          purchase quantity.
        tests:
          - not_null

      - name: source_reorder_point
        description: Reorder point supplied by the source system.

      - name: inventory_reference_date
        description: Date associated with the current inventory snapshot.
        tests:
          - not_null

      - name: inventory_analysis_date
        description: Reference date used for the demand windows.

      - name: last_sale_date
        description: Most recent sale date within the 90-day window.

      - name: sales_quantity_last_30_days
        description: Quantity sold in the latest 30-day window.
        tests:
          - not_null

      - name: sales_quantity_last_60_days
        description: Quantity sold in the latest 60-day window.
        tests:
          - not_null

      - name: sales_quantity_last_90_days
        description: Quantity sold in the latest 90-day window.
        tests:
          - not_null

      - name: average_daily_sales_30d
        description: Average calendar-day sales over 30 days.
        tests:
          - not_null

      - name: average_daily_sales_60d
        description: Average calendar-day sales over 60 days.
        tests:
          - not_null

      - name: average_daily_sales_90d
        description: Average calendar-day sales over 90 days.
        tests:
          - not_null

      - name: selected_lead_time_days
        description: Lead time selected through the fallback hierarchy.
        tests:
          - not_null

      - name: lead_time_source
        description: Source used to determine the selected lead time.
        tests:
          - not_null

      - name: lead_time_observation_count
        description: Number of historical observations supporting the lead time.
        tests:
          - not_null

      - name: lead_time_confidence
        description: Confidence classification for the selected lead time.
        tests:
          - not_null

      - name: is_lead_time_estimated
        description: Indicates whether a fallback lead time was used.
        tests:
          - not_null

      - name: is_demand_history_missing
        description: Indicates absence of valid demand history in the 90-day window.
        tests:
          - not_null

      - name: demand_during_lead_time
        description: Expected demand during the selected replenishment lead time.
        tests:
          - not_null

      - name: safety_stock_quantity
        description: >
          Safety-stock quantity calculated from seven days of average 90-day demand.
        tests:
          - not_null

      - name: recommended_stock_target
        description: Demand during lead time plus safety stock.
        tests:
          - not_null

      - name: suggested_reorder_quantity
        description: >
          Analytical purchase recommendation calculated as the recommended stock
          target minus current stock and open purchase-order quantity, limited
          to zero. The result does not apply package multiples, minimum order
          quantities or operational rounding.
        tests:
          - not_null

      - name: estimated_days_until_stockout
        description: Estimated inventory coverage based on 90-day average demand.

      - name: will_stockout_before_replenishment
        description: >
          Indicates whether current inventory is insufficient to cover expected
          demand during the selected lead time.
        tests:
          - not_null

      - name: is_replenishment_required
        description: >
          Indicates that replenishment is recommended when average 90-day demand
          is positive and current stock is at or below the source reorder point,
          or when current stock plus open purchase-order quantity remains below
          the recommended stock target.
        tests:
          - not_null
