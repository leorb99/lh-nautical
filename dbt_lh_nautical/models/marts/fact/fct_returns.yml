version: 2

models:
  - name: fct_returns
    description: >
      Return fact table with one row per returned item. Supports analysis of
      returned quantities, refunds, exchanges and the impact of completed
      returns on net revenue.

    columns:
      - name: return_item_sk
        description: "Surrogate key generated from return_item_id"
        tests:
          - unique
          - not_null

      - name: return_item_id
        description: "Natural key identifying each returned item"
        tests:
          - not_null

      - name: return_id
        description: "Identifier of the return transaction"
        tests:
          - not_null

      - name: return_number
        description: "Business-facing number identifying the return transaction."

      - name: order_id
        description: "Identifier of the original order"
        tests:
          - not_null

      - name: order_item_id
        description: "Identifier of the original order item"
        tests:
          - not_null

      - name: product_variant_id
        description: "Identifier of the product variant returned"

      - name: customer_id
        description: "Identifier of the customer associated with the return"
        tests:
          - not_null

      - name: received_at_location_id
        description: "Location where the return was received"
        tests:
          - not_null

      - name: return_status
        description: "Current status of the return"
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'open']

      - name: return_reason
        description: "Reason reported for the return."

      - name: return_item_action
        description: "Action applied to the returned item"
        tests:
          - accepted_values:
              arguments:
                values: ['refund', 'exchange']

      - name: exchange_variant_id
        description: >
          Identifier of the replacement product variant when the returned
          item is processed as an exchange.

      - name: return_item_quantity
        description: "Quantity returned"
        tests:
          - not_null

      - name: return_item_unit_refund_amount
        description: "Refund amount per unit returned"

      - name: return_item_total_refund_amount
        description: "Calculated total refund amount for the returned item"

      - name: return_total_refund_amount
        description: >
          Total refund amount recorded for the parent return transaction.
          This return-level value may be repeated across returned items and
          must not be summed directly at the return-item grain.

      - name: returned_at
        description: >
          Analytical return timestamp derived from the source created_at field.
          Future-dated values remain null until the registered date is reached.

      - name: return_date
        description: >
          Date-only grain of returned_at, derived with the same future-date
          check so it's always consistent with it. Use this column (not
          returned_at) to relate fct_returns to dim_dates and for period-based
          DAX.

      - name: is_future_return_date
        description: >
          Indicates whether the source return timestamp is later than the
          current execution timestamp.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_effective_return
        description: >
          Indicates whether the return is completed, has a valid non-future
          return date and is eligible to affect net revenue calculations.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_exchange
        description: "Indicates whether the return item is an exchange"

      - name: is_refund
        description: "Indicates whether the return item is a refund"
