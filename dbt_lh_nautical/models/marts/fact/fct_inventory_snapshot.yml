version: 2

models:
  - name: fct_inventory_snapshot
    description: >
      Historical inventory-position fact built from the stock-level dbt
      snapshot. Each row represents a version of the observed inventory
      balance for one product variant and location. Historical versions begin
      to accumulate from the first dbt snapshot execution.

    columns:
      - name: inventory_snapshot_sk
        description: "Snapshot version key generated and managed by dbt."
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: "Identifier of the product variant."
        tests:
          - not_null

      - name: location_id
        description: "Identifier of the inventory location."
        tests:
          - not_null

      - name: quantity_on_hand
        description: "Observed inventory quantity for this snapshot version."
        tests:
          - not_null

      - name: reorder_point
        description: "Reorder threshold informed by the source system."

      - name: source_updated_at
        description: >
          Timestamp when the stock-level record was last updated in the
          source system.
        tests:
          - not_null

      - name: snapshot_valid_from
        description: "Beginning of the validity period for this balance."
        tests:
          - not_null

      - name: snapshot_valid_to
        description: >
          End of the validity period. Null identifies the currently valid
          snapshot version.

      - name: snapshot_date
        description: "Calendar date associated with the snapshot version."
        tests:
          - not_null

      - name: is_current_snapshot
        description: "Indicates whether this is the currently valid version."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

      - name: is_out_of_stock
        description: "Indicates whether the observed balance is zero."
        tests:
          - not_null

      - name: is_below_reorder_point
        description: >
          Indicates whether the observed balance is less than or equal to the
          source reorder point when that threshold is available.
        tests:
          - not_null
