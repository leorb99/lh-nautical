version: 2

models:
  - name: fct_stock_movements
    description: >
      Inventory movement fact table with one row per stock movement.
      Supports analysis of stock inflows, outflows, sales, purchases,
      returns and inventory consumption over time.

    columns:
      - name: stock_movement_sk
        description: "Surrogate key generated from stock_movement_id."
        tests:
          - unique
          - not_null

      - name: stock_movement_id
        description: "Natural key identifying each inventory movement."
        tests:
          - not_null

      - name: product_variant_id
        description: "Identifier of the product variant affected by the movement."
        tests:
          - not_null

      - name: location_id
        description: "Identifier of the location where the movement occurred."
        tests:
          - not_null

      - name: employee_id
        description: "Identifier of the employee associated with the movement, when available."

      - name: stock_movement_type
        description: "Original inventory movement type from the source system."
        tests:
          - accepted_values:
              arguments:
                values:
                  - purchase_in
                  - sale_out
                  - return_in
                  - return_out

      - name: movement_quantity_signed
        description: >
          Signed movement quantity. Positive values represent stock inflows
          and negative values represent stock outflows.
        tests:
          - not_null

      - name: movement_quantity_absolute
        description: "Absolute quantity associated with the inventory movement."
        tests:
          - not_null

      - name: movement_direction
        description: "Direction of the movement: in, out or zero."
        tests:
          - accepted_values:
              arguments:
                values:
                  - in
                  - out
                  - zero

      - name: movement_business_category
        description: >
          Analytical classification of the movement as purchase, sale,
          customer return, supplier return or other.
        tests:
          - accepted_values:
              arguments:
                values:
                  - purchase
                  - sale
                  - customer_return
                  - supplier_return
                  - other

      - name: stock_movement_reference_table
        description: "Business table associated with the inventory movement."

      - name: stock_movement_reference_id
        description: "Identifier of the related business record."

      - name: stock_movement_notes
        description: "Optional notes associated with the movement."

      - name: occurred_at
        description: "Timestamp when the inventory movement occurred."
        tests:
          - not_null

      - name: movement_date
        description: "Calendar date when the inventory movement occurred."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when the movement record was created."
