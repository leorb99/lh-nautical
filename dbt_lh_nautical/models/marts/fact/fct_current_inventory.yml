version: 2

models:
  - name: fct_current_inventory
    description: >
      Current inventory position fact table with one row per product variant
      and location. Combines the current quantity on hand with demand metrics
      calculated over 30-day, 60-day and 90-day windows. The primary inventory
      health and stockout-risk indicators use the 90-day demand window.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - location_id

    columns:
      - name: current_inventory_sk
        description: >
          Surrogate key generated from product_variant_id and location_id.
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: Identifier of the product variant.
        tests:
          - not_null

      - name: location_id
        description: Identifier of the inventory location.
        tests:
          - not_null

      - name: quantity_on_hand
        description: Current physical quantity available at the location.
        tests:
          - not_null

      - name: source_reorder_point
        description: Reorder point provided by the source system.

      - name: inventory_reference_date
        description: Source date associated with the current inventory position.
        tests:
          - not_null

      - name: sales_quantity_last_30_days
        description: Quantity sold during the latest 30-day analysis window.
        tests:
          - not_null

      - name: sales_quantity_last_60_days
        description: Quantity sold during the latest 60-day analysis window.
        tests:
          - not_null

      - name: sales_quantity_last_90_days
        description: Quantity sold during the latest 90-day analysis window.
        tests:
          - not_null

      - name: average_daily_sales_30d
        description: Average sales quantity per calendar day over 30 days.
        tests:
          - not_null

      - name: average_daily_sales_60d
        description: Average sales quantity per calendar day over 60 days.
        tests:
          - not_null

      - name: average_daily_sales_90d
        description: Average sales quantity per calendar day over 90 days.
        tests:
          - not_null

      - name: days_with_sales_last_30_days
        description: Number of distinct days with sales in the 30-day window.
        tests:
          - not_null

      - name: days_with_sales_last_60_days
        description: Number of distinct days with sales in the 60-day window.
        tests:
          - not_null

      - name: days_with_sales_last_90_days
        description: Number of distinct days with sales in the 90-day window.
        tests:
          - not_null

      - name: last_sale_date
        description: Most recent sale date for the variant and location.

      - name: inventory_analysis_date
        description: >
          Latest sales movement date available and ending date of the demand
          analysis windows.

      - name: inventory_coverage_days_30d
        description: >
          Estimated inventory coverage based on average daily demand over
          the latest 30 days.

      - name: inventory_coverage_days_60d
        description: >
          Estimated inventory coverage based on average daily demand over
          the latest 60 days.

      - name: inventory_coverage_days_90d
        description: >
          Estimated inventory coverage based on average daily demand over
          the latest 90 days.

      - name: inventory_health_status
        description: >
          Inventory health classification based on the 90-day average demand.
          Values are out_of_stock for zero inventory, critical for coverage of
          up to 7 days, attention for coverage above 7 and up to 15 days,
          healthy for coverage above 15 days, and no_recent_sales when no
          demand exists in the 90-day analysis window.
        tests:
          - accepted_values:
              arguments:
                values:
                  - out_of_stock
                  - critical
                  - attention
                  - healthy
                  - no_recent_sales

      - name: is_stockout_risk
        description: >
          Indicates zero inventory or estimated 90-day-based coverage of
          seven days or less.
        tests:
          - not_null
