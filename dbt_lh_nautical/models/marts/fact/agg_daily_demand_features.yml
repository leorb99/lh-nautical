version: 2

models:
  - name: agg_daily_demand_features
    description: >
      Daily demand feature table for the Checkpoint 5 forecasting models.

      Grain: one row per product_variant_id, location_id, and date_day.

      Scope:
      Only product+location pairs with at least one effective sale in their
      history are included. The calendar is spined across each pair's full
      active date range, so every day is represented — days with no sale
      appear with quantity_sold = 0 rather than being absent.

      Lag and rolling-window features are computed over this gap-free daily
      grid, so zero-sale days are correctly reflected. Moving averages
      exclude the current day, to avoid leaking same-day information into a
      feature meant to represent recent trend.

      is_top_10_product ranks products by total effective-sale revenue and is
      meant to scope the classic time-series analysis (ARIMA/Prophet,
      seasonality decomposition) to a manageable, highest-value subset,
      rather than fitting one model per product+location. A category-level
      equivalent may be added later if needed.

    columns:
      - name: product_variant_id
        description: "Foreign key identifying the product variant. Grain-defining column."
        tests:
          - not_null

      - name: location_id
        description: "Foreign key identifying the business location. Grain-defining column."
        tests:
          - not_null

      - name: date_day
        description: "Calendar day. Grain-defining column, spined across each active product+location pair's full date range."
        tests:
          - not_null

      - name: quantity_sold
        description: >
          Total quantity sold for this product+location on this day, from
          effective sales. 0 when the product+location was active but had no
          sale that day, not null/absent.
        tests:
          - not_null

      - name: location_type
        description: "Location type (e.g. store vs. distribution center), from dim_locations."

      - name: category_name
        description: "Product category, from dim_products."

      - name: day_week_num
        description: "Day of week number, from dim_dates (1=Sunday, 7=Saturday)."

      - name: month_num
        description: "Calendar month number, from dim_dates."

      - name: is_holiday
        description: "Whether date_day is a Brazilian national holiday, from dim_dates."

      - name: is_business_day
        description: "Whether date_day is a business day (not weekend, not holiday), from dim_dates."

      - name: lag_1d
        description: "quantity_sold for this same product+location, 1 day before date_day."

      - name: lag_7d
        description: "quantity_sold for this same product+location, 7 days before date_day (same weekday, prior week)."

      - name: lag_30d
        description: "quantity_sold for this same product+location, 30 days before date_day."

      - name: moving_avg_7d
        description: "Average quantity_sold over the 7 days strictly before date_day (excludes date_day itself)."

      - name: moving_avg_30d
        description: "Average quantity_sold over the 30 days strictly before date_day (excludes date_day itself)."

      - name: moving_avg_90d
        description: "Average quantity_sold over the 90 days strictly before date_day (excludes date_day itself)."

      - name: is_top_10_product
        description: >
          True when this product ranks in the top 10 by total effective-sale
          revenue (dense rank over all products). Used to scope classic
          time-series modeling to the highest-revenue products.
        tests:
          - not_null

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quantity_sold >= 0"
