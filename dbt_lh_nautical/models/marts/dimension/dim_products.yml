version: 2

models:
  - name: dim_products
    description: "Product dimension derived from cleaned and enriched product variant data."
    columns:
      - name: product_sk
        description: "Surrogate key generated from product_variant_id and product_id."
        tests:
          - unique
          - not_null
      
      - name: product_variant_id
        description: >
          Primary key for the product variant.

          Uniqueness here is a direct guarantee, not just an inherited one:
          stg_product_variants.product_variant_id is unique, and both models
          left-joined in (int_products_enriched by product_id,
          int_variant_attributes by product_variant_id) are themselves
          unique on their join key, so neither join can fan out a row. This
          test makes that guarantee explicit at the mart itself instead of
          requiring a reader to trace three upstream models to confirm it.
        tests:
          - unique
          - not_null
      
      - name: product_id
        description: "Identifier for the parent product."
        tests:
          - not_null
      
      - name: product_variant_sku
        description: "SKU code for the product variant."
      
      - name: product_variant_barcode_ean
        description: "EAN barcode for the product variant."
      
      - name: product_name
        description: >
          Product name. Falls back to a truncated product_description, then
          to a traceable "Produto Não Identificado (ID: ...)" placeholder,
          when the name itself is missing or a known garbage value (e.g.
          "n/a", "todo", "asdf").

          Casing is preserved as-is from the source, only trimmed.

      - name: product_description
        description: >
          Product description with known placeholder/garbage values nulled
          out. Casing is preserved as-is from the source, only trimmed.
      
      - name: product_unit_of_measure
        description: "Unit of measure for the product."
      
      - name: product_ncm_code
        description: "NCM classification code for the product."
      
      - name: category_name
        description: >
          Name of the product category, trimmed with internal whitespace
          collapsed. Not capitalization-normalized: a general casing rule
          was tried and rejected because it corrupts real values (e.g.
          "Coletes Salva-Vidas" losing its hyphen or its capitalization
          after it). The one known bad source value, 'SEGURANÇA' (all caps,
          unlike its 13 sibling categories), is corrected explicitly to
          'Segurança' instead.

          This is the field the Bloco 2 "category share of revenue over
          time" chart groups by.

      - name: category_url_slug
        description: "URL slug for the product category."

      - name: parent_category_name
        description: >
          Name of the parent category. Same cleaning as category_name above
          (trim, whitespace collapse, no capitalization, explicit
          'SEGURANÇA' correction).

      - name: brand_name
        description: >
          Name of the product brand, trimmed with internal whitespace
          collapsed. Not capitalization-normalized: this catalog has brand
          names with intentional capitalization that a general casing rule
          would destroy (e.g. "BR Náutica", "MaxSea").
      
      - name: brand_country
        description: "Country of origin for the product brand."
      
      - name: product_variant_weight_kg
        description: "Weight of the product variant in kilograms."
      
      - name: product_variant_sale_price
        description: "Sale price of the product variant."
      
      - name: product_variant_cost_price
        description: "Cost price of the product variant."
      
      - name: product_variant_icms_rate
        description: "ICMS tax rate for the product variant."
      
      - name: product_variant_ipi_rate
        description: "IPI tax rate for the product variant."
      
      - name: attr_color
        description: >
          Color attribute, fuzzy-corrected against a list of valid colors
          using Levenshtein edit distance (accepted within a distance of 2,
          otherwise null rather than a guessed value). Absorbs source-system
          typos without accepting arbitrary free text as a color.
      
      - name: attr_size
        description: "Cleaned size attribute for the product variant."
      
      - name: attr_length_m
        description: "Length attribute in meters for the product variant."
      
      - name: attr_power_hp
        description: "Power attribute in horsepower for the product variant."
      
      - name: attr_voltage_v
        description: "Voltage attribute in volts for the product variant."
      
      - name: attr_weight_kg
        description: "Weight attribute in kilograms for the product variant."
      
      - name: attr_waterproof
        description: "Boolean flag indicating whether the product variant is waterproof."
      
      - name: attr_material
        description: >
          Material attribute, fuzzy-corrected against a list of valid
          materials using the same Levenshtein approach as attr_color.
          Added after confirming two real typos in this catalog: "alumíni"
          next to "alumínio", and "inoox" next to "inox", both now merged
          into their correct spelling.
      
      - name: is_variant_active
        description: "Indicates whether the product variant is active."

      - name: is_product_active
        description: "Indicates whether the parent product is active."
      
      - name: is_brand_active
        description: "Indicates whether the related brand is active."
      
      - name: is_category_active
        description: "Indicates whether the related category is active."
      
      - name: product_created_at
        description: "Creation timestamp of the source product record."
      
      - name: brand_created_at
        description: "Creation timestamp of the source brand record."