version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension, one row per customer, with their primary address.
      Excludes updated_at (source audit timestamp, no analytical value here)
      and primary_address_id (technical reference, already denormalized into
      the address attributes below), both present in int_customers
    columns:
      - name: customer_sk
        description: >
          Surrogate key for the customer, generated from customer_id. Decoupled
          from the source system's ID; other models should join on this key
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Natural/business key for the customer, as assigned by the source system"
        tests:
          - unique
          - not_null

      - name: customer_person_type
        description: "Type of customer person, 'PF' (individual) or 'PJ' (company)"

      - name: customer_legal_name
        description: "Legal name of the customer"
        databricks_tags:
          data_classification: "pii"

      - name: customer_trade_name
        description: "Trade name (fantasy name) of the customer, applicable only to PJ customers"

      - name: customer_tax_id
        description: "Tax identification number of the customer (CPF for individuals, CNPJ for companies)"
        databricks_tags:
          data_classification: "pii"

      - name: customer_state_registration
        description: "State registration number of the customer, applicable only to PJ customers"
        databricks_tags:
          data_classification: "pii"

      - name: customer_email
        description: "Email address of the customer"
        databricks_tags:
          data_classification: "pii"

      - name: customer_phone
        description: "Phone number of the customer"
        databricks_tags:
          data_classification: "pii"

      - name: is_active
        description: "Indicates whether the customer is currently active"

      - name: created_at
        description: "Timestamp when the customer record was created in the source system. Nullified when found in the future"

      - name: primary_address_type
        description: "Type of the primary address (e.g. billing, secondary)"

      - name: primary_address_postal_code
        description: "Postal code of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_street_name
        description: "Street name of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_number
        description: "Address number of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_complement
        description: "Complement of the primary address (e.g. apartment, block)"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_district
        description: "District/neighborhood of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_city
        description: "City of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_state
        description: "State of the primary address"
        databricks_tags:
          data_classification: "pii"

      - name: primary_address_country
        description: "Country of the primary address"
        databricks_tags:
          data_classification: "pii"
