version: 2

models:
  - name: dim_suppliers
    description: >
      Supplier dimension with one row per supplier. Contains identification,
      contact, country and activity-status attributes for procurement and
      inventory analyses.

    columns:
      - name: supplier_sk
        description: "Surrogate key generated from supplier_id."
        tests:
          - unique
          - not_null

      - name: supplier_id
        description: "Natural key identifying the supplier."
        tests:
          - not_null

      - name: supplier_legal_name
        description: "Registered legal name of the supplier."
        tests:
          - not_null
        databricks_tags:
          data_classification: "sensitive"

      - name: supplier_trade_name
        description: "Commercial or trade name of the supplier."

      - name: supplier_display_name
        description: >
          Preferred supplier name for reporting, using the trade name when
          available and the legal name otherwise.
        tests:
          - not_null

      - name: supplier_country
        description: "Country where the supplier is registered."
        tests:
          - not_null

      - name: supplier_tax_id
        description: "Supplier tax identification number."
        tests:
          - unique
          - not_null
        databricks_tags:
          data_classification: "sensitive"

      - name: supplier_tax_id_type
        description: "Type of supplier tax identifier."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CNPJ
                  - VAT

      - name: supplier_email
        description: "Primary supplier contact email."
        tests:
          - unique
          - not_null
        databricks_tags:
          data_classification: "pii"

      - name: supplier_phone
        description: "Primary supplier contact phone number."
        databricks_tags:
          data_classification: "pii"

      - name: supplier_contact_name
        description: "Main contact person at the supplier."
        databricks_tags:
          data_classification: "pii"

      - name: is_active
        description: "Indicates whether the supplier is active."
        tests:
          - not_null

      - name: supplier_status
        description: "Readable supplier activity status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active
                  - inactive

      - name: created_at
        description: "Timestamp when the supplier record was created."

      - name: updated_at
        description: "Timestamp when the supplier record was last updated."
