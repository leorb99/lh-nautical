version: 2

models:
  - name: int_inventory_snapshots
    description: >
      Standardizes the full inventory snapshot history and centralizes
      current-record, stockout and reorder-point rules for downstream models.

    columns:
      - name: inventory_snapshot_sk
        description: Unique identifier of the inventory snapshot record.
        tests:
          - not_null
          - unique

      - name: product_variant_id
        description: Identifier of the product variant.
        tests:
          - not_null

      - name: location_id
        description: Identifier of the inventory location.
        tests:
          - not_null

      - name: quantity_on_hand
        description: Quantity available during the snapshot validity period.
        tests:
          - not_null

      - name: reorder_point
        description: Source-defined inventory reorder threshold.

      - name: source_updated_at
        description: Timestamp of the source inventory update.

      - name: snapshot_valid_from
        description: Timestamp from which the snapshot record became valid.
        tests:
          - not_null

      - name: snapshot_valid_to
        description: Timestamp until which the snapshot record remained valid.

      - name: snapshot_date
        description: Calendar date on which the snapshot record became valid.
        tests:
          - not_null

      - name: is_current_snapshot
        description: Indicates whether the snapshot record is currently active.
        tests:
          - not_null

      - name: is_out_of_stock
        description: Indicates whether quantity on hand is zero.
        tests:
          - not_null

      - name: is_below_reorder_point
        description: Indicates whether inventory is at or below the reorder point.
        tests:
          - not_null
