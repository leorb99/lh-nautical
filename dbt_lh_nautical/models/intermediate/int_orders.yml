version: 2

models:
  - name: int_orders
    description: "Intermediate model for order headers joined with their fiscal invoice, one row per order"
    columns:
      - name: order_id
        description: "Primary key for the order"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key pointing to the customer who placed the order"

      - name: salesperson_id
        description: "Foreign key pointing to the employee who acted as salesperson for this order"

      - name: location_id
        description: "Foreign key pointing to the location where the order was placed"

      - name: order_number
        description: "The natural key / human-readable order number"

      - name: order_channel
        description: "The sales channel where the order originated (e.g., ecommerce, pos)"

      - name: order_status
        description: "The current lifecycle status of the order"

      - name: order_subtotal_amount
        description: "The order amount before discounts"

      - name: order_discount_amount
        description: "The discount amount applied to the order"

      - name: order_total_amount
        description: "The final total amount of the order after discounts"

      - name: placed_at
        description: "Timestamp when the order was placed. Nullified when found in the future"

      - name: created_at
        description: "Timestamp when the order record was created in the source system. Nullified when found in the future"

      - name: updated_at
        description: "Timestamp when the order record was last updated in the source system. Nullified when found in the future"

      - name: fiscal_invoice_id
        description: "Primary key of the fiscal invoice associated with this order, if one exists"

      - name: fiscal_invoice_nfe_number
        description: "The NF-e number of the fiscal invoice"

      - name: fiscal_invoice_nfe_access_key
        description: "The unique access key of the electronic fiscal invoice"

      - name: fiscal_invoice_series
        description: "The series of the fiscal invoice"

      - name: fiscal_invoice_status
        description: "The current status of the fiscal invoice"

      - name: fiscal_invoice_total_amount
        description: "The total monetary value of the fiscal invoice"

      - name: fiscal_invoice_xml_storage_uri
        description: "Storage location of the fiscal invoice XML file"

      - name: authorized_fiscal_invoice_amount
        description: "The fiscal invoice amount, counted only if the invoice is authorized; zero otherwise"

      - name: fiscal_invoice_issued_at
        description: "Timestamp when the fiscal invoice was issued. Nullified when found in the future"

      - name: fiscal_invoice_created_at
        description: "Timestamp when the fiscal invoice record was created in the source system. Nullified when found in the future"

      - name: fiscal_invoice_updated_at
        description: "Timestamp when the fiscal invoice record was last updated in the source system. Nullified when found in the future"

      - name: is_effective_sale
        description: >
          Indicates whether this order counts as an effective/completed sale:
          order_status is 'paid', fiscal_invoice_status is 'authorized', and
          placed_at is not null. Orders paid but with a cancelled or rejected
          invoice are excluded, since they lack valid fiscal documentation for
          the sale. Orders whose placed_at was nullified for being in the
          future are also excluded, since nullifying alone doesn't stop their
          order_total_amount from being summed into KPIs.

      - name: is_paid_sale_pending_invoice_fix
        description: >
          Indicates an order that was paid but whose fiscal invoice was
          rejected (fails fiscal validation, but could still be reissued).
          This is revenue pending regularization, not lost revenue, and is
          tracked separately from is_effective_sale since the invoice isn't
          valid yet. Does not cover orders with a cancelled invoice, a
          separate and more ambiguous case (possibly meaning the sale itself
          was reversed).

    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_orders')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_subtotal_amount - order_discount_amount = order_total_amount"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fiscal_invoice_status != 'authorized' or order_total_amount = fiscal_invoice_total_amount"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_discount_amount <= order_subtotal_amount"
