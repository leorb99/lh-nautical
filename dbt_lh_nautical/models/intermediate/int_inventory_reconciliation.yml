version: 2

models:
  - name: int_inventory_reconciliation
    description: >
      Reconciliation between changes in observed stock-level snapshots and
      the net inventory movements recorded between consecutive snapshots.
      The model will only produce records after at least two versions exist
      for the same product variant and location.

    columns:
      - name: inventory_snapshot_sk
        description: "Identifier of the inventory snapshot being reconciled."
        tests:
          - unique
          - not_null

      - name: product_variant_id
        description: "Identifier of the product variant."
        tests:
          - not_null

      - name: location_id
        description: "Identifier of the inventory location."
        tests:
          - not_null

      - name: previous_snapshot_valid_from
        description: "Beginning timestamp of the previous observed balance."
        tests:
          - not_null

      - name: snapshot_valid_from
        description: "Beginning timestamp of the current observed balance."
        tests:
          - not_null

      - name: previous_quantity_on_hand
        description: "Observed quantity in the preceding snapshot."
        tests:
          - not_null

      - name: observed_quantity_on_hand
        description: "Observed quantity in the current snapshot."
        tests:
          - not_null

      - name: observed_quantity_change
        description: >
          Difference between the current and previous observed stock balances.
        tests:
          - not_null

      - name: net_movement_quantity
        description: >
          Sum of signed inventory movements recorded between the two snapshot
          validity timestamps.
        tests:
          - not_null

      - name: reconciliation_difference
        description: >
          Difference between the observed balance variation and the net
          movement quantity. Zero indicates exact reconciliation.
        tests:
          - not_null

      - name: reconciliation_status
        description: "Result of the reconciliation comparison."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - reconciled
                  - difference_detected
