version: 2

models:
  - name: int_customers
    description: >
      Intermediate model joining cleaned customer records with their primary
      address. Applies data cleaning rules discovered during profiling of
      stg_customers and stg_addresses.
    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - unique
          - not_null

      - name: customer_person_type
        description: "Type of customer person: 'PF' (individual) or 'PJ' (company)"

      - name: customer_legal_name
        description: >
          Legal name of the customer. Titles (Dr., Dra., Sr., Sra., Srta.) are
          stripped, and the 'TBD' placeholder is converted to null.

      - name: customer_trade_name
        description: "Trade name (fantasy name) of the customer, applicable only to PJ customers"

      - name: customer_tax_id
        description: "Tax identification number of the customer (CPF for individuals, CNPJ for companies)"
        tests:
          - not_null
          - unique

      - name: customer_state_registration
        description: >
          State registration number. 'TAX-EXEMPT' indicates a valid tax-exempt
          fiscal status (new value introduced by cleaning logic). Placeholder
          values ('NAO POSSUI', '0') are converted to null.

      - name: customer_email
        description: "Email address of the customer, normalized to lowercase"

      - name: customer_phone
        description: >
          Phone number in '55' + DDD + number format. Invalid placeholder
          values (e.g. '0000000000', 'tel.: 0000') are converted to null.

      - name: is_active
        description: "Indicates whether the customer is currently active"

      - name: created_at
        description: "Timestamp of when the customer record was created in the source system"

      - name: updated_at
        description: "Timestamp of when the customer record was last updated in the source system"

      - name: primary_address_id
        description: "Identifier of the customer's primary address, if one exists"

      - name: primary_address_type
        description: "Type of the primary address (e.g. billing, secondary)"

      - name: primary_postal_code
        description: "Postal code of the primary address, standardized to digits only"

      - name: primary_street_name
        description: "Street name of the primary address"

      - name: primary_address_number
        description: "Address number of the primary address (string, may contain letters)"

      - name: primary_address_complement
        description: >
          Complement of the primary address (e.g. apartment, block). Placeholder
          values found in the source (e.g. 'TBD', 'N/A', punctuation-only) are
          converted to null.

      - name: primary_district
        description: "District/neighborhood of the primary address"

      - name: primary_city
        description: "City of the primary address"

      - name: primary_state
        description: "State of the primary address"

      - name: primary_country
        description: "Country of the primary address"

    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_customers')