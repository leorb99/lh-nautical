version: 2

models:
  - name: int_inventory_consumption_30d
    description: >
      Intermediate model containing product demand indicators by product
      variant and location. Demand is based only on sale_out movements during
      the 30 calendar days ending on the latest movement date available in
      the dataset.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - location_id

    columns:
      - name: product_variant_id
        description: "Identifier of the product variant."
        tests:
          - not_null

      - name: location_id
        description: "Identifier of the inventory location."
        tests:
          - not_null

      - name: inventory_analysis_date
        description: >
          Latest movement date available in the dataset and reference date
          used for the 30-day consumption window.
        tests:
          - not_null

      - name: sales_quantity_last_30_days
        description: "Total quantity sold during the 30-day analysis window."
        tests:
          - not_null

      - name: days_with_sales_last_30_days
        description: "Number of distinct days with sales in the analysis window."

      - name: last_sale_date
        description: "Most recent sale date for the variant and location."

      - name: average_daily_sales_30d
        description: >
          Average daily sales calculated as total sales quantity in the
          30-day window divided by 30 calendar days.
        tests:
          - not_null
