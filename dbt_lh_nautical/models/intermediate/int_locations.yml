version: 2

models:
  - name: int_locations
    description: >
      Intermediate model for physical locations (stores and warehouses).
      Applies data cleaning rules discovered during profiling of stg_locations.
    columns:
      - name: location_id
        description: "Unique identifier for the location"
        tests:
          - unique
          - not_null

      - name: location_name
        description: "Commercial or internal name of the location, capitalized and with extra spaces removed"

      - name: location_type
        description: "Categorization of the location (e.g., store, warehouse), normalized to lowercase"

      - name: location_postal_code
        description: "Postal code of the location, standardized to digits only"

      - name: location_street
        description: "Street name of the location"

      - name: location_number
        description: "Address number of the location"

      - name: location_complement
        description: >
          Complement of the location address (e.g. block, floor). '[NULL]'
          placeholder strings and blank values are converted to null.

      - name: location_district
        description: "District/neighborhood of the location"

      - name: location_city
        description: "City of the location"

      - name: location_state
        description: "State of the location"

      - name: location_country
        description: "Country of the location"

      - name: is_active
        description: "Indicates whether the location is currently operational"

      - name: created_at
        description: "Timestamp of when the location record was created in the source system. Nullified when found in the future"

      - name: updated_at
        description: "Timestamp of when the location record was last updated in the source system. Nullified when found in the future"
