version: 2

models:
  - name: int_products_enriched
    description: >
      Intermediate model that enriches raw product data with brand and category
      metadata while applying cleaning rules to description and name fields.
    
    columns:
      - name: product_id
        description: "Primary key of the product."
        tests:
          - unique
          - not_null

      - name: product_name
        description: >
          Product name. Falls back to the first 40 characters of
          product_description when the name itself is missing or garbage,
          and to a traceable "Produto Não Identificado (ID: ...)" placeholder
          when both are missing.

          Casing is preserved as-is from the source (only trimmed): this
          field no longer forces lowercase. It previously did, as a side
          effect of the garbage-value detection macro (nullify_garbage)
          lowercasing its entire return value, not just the comparison used
          to detect placeholder text.
        tests:
          - not_null

      - name: product_description
        description: >
          Product description with known placeholder/garbage values (e.g.
          "n/a", "todo", "TODO: add description", "asdf") nulled out via
          nullify_garbage. Casing is preserved as-is from the source (only
          trimmed), same correction as product_name above.
      
      - name: product_ncm_code
        description: "NCM classification code for the product."
      
      - name: product_unit_of_measure
        description: "Unit of measure for the product."
      
      - name: is_product_active
        description: "Indicates whether the product is active."
      
      - name: product_created_at
        description: "Creation timestamp from the source product record."
      
      - name: product_updated_at
        description: "Last update timestamp from the source product record."

      - name: brand_id
        description: "Foreign key to the product brand."
        tests:
          - not_null
            
      - name: brand_name
        description: >
          Name of the product brand, trimmed with internal whitespace
          collapsed to a single space. No capitalization is applied: an
          initcap()-based fix was tried and rejected, since it corrupts real
          brand names in this catalog (e.g. "BR Náutica" becomes
          "Br Náutica", "MaxSea" becomes "Maxsea").
      
      - name: brand_country
        description: "Country of origin for the brand."
      
      - name: is_brand_active
        description: "Indicates whether the related brand is active."
      
      - name: brand_created_at
        description: "Creation timestamp from the source brand record."
      
      - name: brand_updated_at
        description: "Last update timestamp from the source brand record."

      - name: category_id
        description: "Foreign key to the product category."
        tests:
          - not_null
      
      - name: category_name
        description: >
          Name of the product category, trimmed with internal whitespace
          collapsed to a single space. No general-purpose capitalization is
          applied: it would corrupt real values, e.g. turning
          "Coletes Salva-Vidas" into "Coletes Salva-vidas" (initcap alone) or
          "Coletes SalvaVidas" (initcap() combined with a title-removal regex
          that also strips hyphens).

          The one confirmed bad value, 'SEGURANÇA' (all caps, unlike every
          other category in this table), is corrected explicitly to
          'Segurança' instead, since no general casing rule proved safe
          against the rest of the real category list.
      
      - name: category_url_slug
        description: "URL slug for the product category."
      
      - name: parent_category_id
        description: "Foreign key to the parent category."
      
      - name: parent_category_name
        description: >
          Name of the parent category. Same cleaning as category_name above
          (trim, whitespace collapse, no capitalization, explicit
          'SEGURANÇA' correction): both columns are sourced from the same
          stg_categories.category_name, one via the child alias and one via
          the parent alias of the self-join, so the same category can appear
          through either column.
      
      - name: is_category_active
        description: "Indicates whether the related category is active."
      
      - name: category_created_at
        description: "Creation timestamp from the source category record."
      
      - name: category_updated_at
        description: "Last update timestamp from the source category record."
    
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_products')
