version: 2

models:
  - name: int_returns
    description: >
      Intermediate model that combines return headers, return items and order
      items. The model has one row per returned item and prepares return
      business rules for the Gold layer.

    columns:
      - name: return_item_id
        description: "Natural key identifying each returned item"
        tests:
          - unique
          - not_null

      - name: return_id
        description: "Identifier of the return containing the item"
        tests:
          - not_null

      - name: order_item_id
        description: "Identifier of the original order item"
        tests:
          - not_null

      - name: product_variant_id
        description: "Product variant associated with the original order item"

      - name: return_item_quantity
        description: "Quantity of the item included in the return"
        tests:
          - not_null

      - name: return_item_total_refund_amount
        description: >
          Total refund amount for the returned item, calculated as returned
          quantity multiplied by unit refund amount.

      - name: is_future_return_date
        description: >
          Indicates whether the original return timestamp is later than the
          current pipeline execution timestamp.

      - name: is_effective_return
        description: >
          Indicates whether the return is completed and its return timestamp
          is not in the future.

      - name: is_exchange
        description: "Indicates whether the returned item resulted in an exchange"

      - name: is_refund
        description: "Indicates whether the returned item resulted in a refund"
