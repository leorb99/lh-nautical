version: 2

models:
  - name: int_variant_attributes
    description: >
      Intermediate model that pivots cleaned variant attribute values into a single
      wide row per product variant for easier analytics consumption.

    columns:
      - name: product_variant_id
        description: "Primary key of the product variant."
        tests:
          - unique
          - not_null

      - name: attr_color
        description: >
          Color attribute for the product variant, fuzzy-corrected against
          the valid_colors seed.

          The raw value is trimmed, lowercased, and compared to every entry
          in valid_colors using Levenshtein edit distance. The closest match
          is accepted only when its distance is 2 or less; otherwise the
          attribute is null rather than a guessed, possibly wrong, color.
          This exists to absorb typos in the source system (e.g. a raw value
          one character off from a valid color) without silently accepting
          arbitrary free text as a color.

      - name: attr_size
        description: "Normalized size attribute for the product variant."

      - name: attr_length_m
        description: "Length attribute in meters."

      - name: attr_power_hp
        description: "Power attribute in horsepower."

      - name: attr_voltage_v
        description: "Voltage attribute in volts."

      - name: attr_weight_kg
        description: "Weight attribute in kilograms."

      - name: attr_waterproof
        description: "Boolean flag indicating whether the product variant is waterproof."

      - name: attr_material
        description: >
          Material attribute for the product variant, fuzzy-corrected
          against the valid_materials seed, using the exact same mechanism
          as attr_color (trim, lowercase, Levenshtein distance against the
          seed, accepted only within a distance of 2).

          Added after confirming two real, low-frequency typos in this
          column against the full distinct value list: "alumíni" (1
          occurrence) beside "alumínio" (43 combined after the fix), and
          "inoox" (1 occurrence) beside "inox" (43 combined). Before this
          fix, both typos passed through as if they were distinct,
          legitimate materials.
