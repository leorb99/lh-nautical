version: 2

models:
  - name: int_current_inventory
    description: >
      Represents the current inventory state for each product variant and
      location, based on the active dbt snapshot record.

    columns:
      - name: current_inventory_snapshot_sk
        description: Unique snapshot identifier generated by dbt.
        tests:
          - not_null
          - unique

      - name: product_variant_id
        description: Identifier of the product variant.
        tests:
          - not_null

      - name: location_id
        description: Identifier of the inventory location.
        tests:
          - not_null

      - name: quantity_on_hand
        description: Current quantity available in inventory.
        tests:
          - not_null

      - name: reorder_point
        description: Source-defined inventory reorder threshold.

      - name: source_updated_at
        description: Timestamp of the latest source update.

      - name: snapshot_valid_from
        description: Timestamp from which the current snapshot record became valid.
        tests:
          - not_null

      - name: snapshot_date
        description: Date on which the current snapshot record became valid.
        tests:
          - not_null

      - name: is_out_of_stock
        description: Indicates whether the current quantity on hand is zero.
        tests:
          - not_null

      - name: is_below_reorder_point
        description: Indicates whether inventory is at or below its reorder point.
        tests:
          - not_null
