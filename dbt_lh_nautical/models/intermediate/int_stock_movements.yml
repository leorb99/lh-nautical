version: 2

models:
  - name: int_stock_movements
    description: >
      Standardizes stock movements and centralizes movement direction,
      absolute quantity and business category rules for downstream models.

    columns:
      - name: stock_movement_sk
        description: Surrogate key for the stock movement.
        tests:
          - not_null
          - unique

      - name: stock_movement_id
        description: Source identifier of the stock movement.
        tests:
          - not_null
          - unique

      - name: product_variant_id
        description: Identifier of the affected product variant.
        tests:
          - not_null

      - name: location_id
        description: Identifier of the affected inventory location.
        tests:
          - not_null

      - name: movement_quantity_signed
        description: Signed quantity of the inventory movement.
        tests:
          - not_null

      - name: movement_quantity_absolute
        description: Absolute quantity of the inventory movement.
        tests:
          - not_null

      - name: movement_direction
        description: Direction derived from the signed movement quantity.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - in
                  - out
                  - zero

      - name: movement_business_category
        description: Business classification derived from the movement type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - purchase
                  - sale
                  - customer_return
                  - supplier_return
                  - other

      - name: occurred_at
        description: Timestamp when the inventory movement occurred.
        tests:
          - not_null

      - name: movement_date
        description: Calendar date when the inventory movement occurred.
        tests:
          - not_null
